[project]
name = "radar-contratacion-publica"
version = "0.1.0"
description = "Pipeline de datos sobre la contratación pública española: ingesta, modelo en estrella e indicadores de riesgo"
readme = "README.md"
authors = [
    { name = "Jairo Seijo", email = "324151067+jairo-seijo@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "lxml>=6.1.3",
    "pandas>=3.1.0",
    "requests>=2.34.2",
]

[project.scripts]
radar-contratacion-publica = "radar_contratacion_publica:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
